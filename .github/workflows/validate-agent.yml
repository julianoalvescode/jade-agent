name: Validate Jade
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_install:
        description: Testar instalação completa com fontes externas fixadas
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate package
        run: python3 scripts/validate.py
      - name: Test installer
        run: python3 -m unittest discover -s tests -v
      - name: Full installation smoke test
        if: github.event_name == 'workflow_dispatch' && inputs.full_install
        run: |
          project_dir="$(mktemp -d)"
          python3 scripts/install.py claude-code --project "$project_dir"
